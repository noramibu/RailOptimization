plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version "${moddevgradle_version}"
}

base {
    archivesName = "${archives_base_name}-${mod_version}-neoforge"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(project.java_version as int)

sourceSets {
    main {
        java {
            srcDirs = ['../common/src/main/java', 'src/main/java']
        }
        resources {
            srcDirs = ['../common/src/main/resources', 'src/main/resources', 'src/generated/resources']
        }
    }
}

repositories {
    maven {
        name = 'Sponge'
        url = 'https://repo.spongepowered.org/repository/maven-public/'
    }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            programArgument '--nogui'
        }

        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    compileOnly "org.spongepowered:mixin:${mixin_version}"
}

tasks.withType(ProcessResources).configureEach {
    def replaceProperties = [
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            minecraft_version_range: neo_minecraft_version_range
    ]

    inputs.properties(replaceProperties)

    filesMatching('META-INF/neoforge.mods.toml') {
        expand(replaceProperties)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = project.java_version as int
    options.encoding = 'UTF-8'
}

tasks.named('jar', Jar) {
    manifest {
        attributes(['MixinConfigs': 'railoptimization.mixins.json'])
    }
    def neoForgeArchiveName = base.archivesName.get()
    from('../LICENSE') {
        rename { "${it}_${neoForgeArchiveName}" }
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
}
